name: CI

on:
  push:
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++ engines
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build C++ engines
        run: cmake --build build --config Release -j2
      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Python syntax check
        run: python -m compileall -q python/math_sim
      - name: Install static checker
        run: python -m pip install --disable-pip-version-check ruff==0.16.9
      - name: Python undefined-name check
        run: ruff check python/math_sim --select F821
      - name: Architecture dependency gate
        run: python tools/architecture/check_dependencies.py
      - name: C# oop-design-checker readiness gate
        run: python tools/architecture/check_csharp_oop_gate.py
      - name: Run dependency-free Python tests
        env:
          PYTHONPATH: python
        run: |
          python -m unittest discover -s tests -p "test_registry.py"
          python -m unittest discover -s tests -p "test_catalog.py"
          python -m unittest discover -s tests -p "test_search.py"
          python -m unittest discover -s tests -p "test_biology_registry.py"
          python -m unittest discover -s tests -p "test_architecture_check.py"
          python -m unittest discover -s tests -p "test_csharp_oop_gate.py"
          python -m unittest discover -s tests -p "test_navigation.py"
          python -m unittest discover -s tests -p "test_application_services.py"
          python -m unittest discover -s tests -p "test_maze_state.py"
          python -m unittest discover -s tests -p "test_maze_controllers.py"
      - name: Native engine E2E
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s tests/e2e -p "test_*.py"

  sanitizers:
    runs-on: ubuntu-latest
    env:
      CC: gcc-13
      CXX: g++-13
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      PYTHONPATH: python
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitized C++ engines
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DMATH_SIM_ENABLE_SANITIZERS=ON
      - name: Build sanitized C++ engines
        run: cmake --build build --config Debug -j2
      - name: Run sanitized C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Run sanitized native engine E2E
        run: python -m unittest discover -s tests/e2e -p "test_*.py"
