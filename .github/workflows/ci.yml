name: CI

on:
  push:
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++ engines
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build C++ engines
        run: cmake --build build --config Release -j2
      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Python syntax check
        run: python -m compileall -q python/math_sim
      - name: Install static checker
        run: python -m pip install --disable-pip-version-check ruff==0.16.9
      - name: Python readability and correctness lint
        run: ruff check python/math_sim --select F821,F841,E712
      - name: Architecture dependency gate
        run: python tools/architecture/check_dependencies.py
      - name: C# oop-design-checker readiness gate
        run: python tools/architecture/check_csharp_oop_gate.py
      - name: Run dependency-free Python tests
        env:
          PYTHONPATH: python
        run: |
          python -m unittest discover -s tests -p "test_registry.py"
          python -m unittest discover -s tests -p "test_catalog.py"
          python -m unittest discover -s tests -p "test_search.py"
          python -m unittest discover -s tests -p "test_biology_registry.py"
          python -m unittest discover -s tests -p "test_architecture_check.py"
          python -m unittest discover -s tests -p "test_csharp_oop_gate.py"
          python -m unittest discover -s tests -p "test_json_like_comments.py"
          python -m unittest discover -s tests -p "test_navigation.py"
          python -m unittest discover -s tests -p "test_application_services.py"
          python -m unittest discover -s tests -p "test_maze_state.py"
          python -m unittest discover -s tests -p "test_maze_controllers.py"
      - name: Native engine E2E
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s tests/e2e -p "test_*.py"

  sanitizers:
    runs-on: ubuntu-latest
    env:
      CC: gcc-13
      CXX: g++-13
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      PYTHONPATH: python
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitized C++ engines
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DMATH_SIM_ENABLE_SANITIZERS=ON
      - name: Build sanitized C++ engines
        run: cmake --build build --config Debug -j2
      - name: Run sanitized C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Run sanitized native engine E2E
        run: python -m unittest discover -s tests/e2e -p "test_*.py"

  readme-gate:
    name: README coverage and review gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Check README coverage, requirements, and links
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python tools/architecture/check_readmes.py --base "$BASE_SHA"
          else
            python tools/architecture/check_readmes.py
          fi

  commentout-gate:
    name: JSON-like Comment Outs gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Check changed production declarations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python tools/architecture/check_json_like_comments.py --base "$BASE_SHA"
          else
            python tools/architecture/check_json_like_comments.py
          fi

  detect-language-modules:
    name: Detect Go and Rust modules
    runs-on: ubuntu-latest
    outputs:
      has_go: ${{ steps.detect.outputs.has_go }}
      has_rust: ${{ steps.detect.outputs.has_rust }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        name: Check tracked manifests
        shell: bash
        run: |
          if find . -name go.mod -not -path './.git/*' -not -path '*/vendor/*' -print -quit | grep -q .; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_go=false" >> "$GITHUB_OUTPUT"
          fi
          if find . -name Cargo.toml -not -path './.git/*' -not -path '*/target/*' -print -quit | grep -q .; then
            echo "has_rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_rust=false" >> "$GITHUB_OUTPUT"
          fi

  go-quality:
    name: Go quality gates
    needs: detect-language-modules
    if: needs.detect-language-modules.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Install Go analyzers
        env:
          GOBIN: ${{ runner.temp }}/go-tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install github.com/gordonklaus/ineffassign@v0.2.0
          go install github.com/kisielk/errcheck@v1.20.0
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Check gofmt
        shell: bash
        run: |
          mapfile -d '' files < <(git ls-files -z '*.go')
          if ((${#files[@]})); then
            unformatted="$(gofmt -l "${files[@]}")"
            if [[ -n "$unformatted" ]]; then
              printf '%s\n' "$unformatted"
              exit 1
            fi
          fi
      - name: Vet and lint every Go module
        shell: bash
        run: |
          while IFS= read -r -d '' module_file; do
            module_dir="$(dirname "$module_file")"
            echo "Checking Go module: $module_dir"
            pushd "$module_dir" >/dev/null
            go vet ./...
            staticcheck ./...
            ineffassign ./...
            errcheck -blank -assert ./...
            popd >/dev/null
          done < <(find . -name go.mod -not -path './.git/*' -not -path '*/vendor/*' -print0 | sort -z)

  rust-quality:
    name: Rust quality gates
    needs: detect-language-modules
    if: needs.detect-language-modules.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting and Clippy in every Rust manifest
        shell: bash
        run: |
          while IFS= read -r -d '' manifest; do
            echo "Checking Rust manifest: $manifest"
            cargo fmt --manifest-path "$manifest" --all -- --check
            if grep -q '^\[workspace\]' "$manifest"; then
              cargo clippy --manifest-path "$manifest" --workspace --all-targets --all-features -- -D warnings -D clippy::unwrap_used -D clippy::expect_used
            else
              cargo clippy --manifest-path "$manifest" --all-targets --all-features -- -D warnings -D clippy::unwrap_used -D clippy::expect_used
            fi
          done < <(find . -name Cargo.toml -not -path './.git/*' -not -path '*/target/*' -print0 | sort -z)
