name: Windows Package

on:
  push:
  pull_request:

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove affected emSign root from runner trust stores
        shell: pwsh
        run: |
          $fingerprint = '86A1ECBA089C4A8D3BBE2734C612BA341D813E043CF9E8A862CD5C57A36BBE6B'
          $roots = @('Cert:\LocalMachine\Root', 'Cert:\CurrentUser\Root')
          $matches = foreach ($root in $roots) {
            Get-ChildItem -LiteralPath $root | Where-Object {
              [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($_.RawData)) -eq $fingerprint
            }
          }
          foreach ($certificate in $matches) {
            Remove-Item -LiteralPath $certificate.PSPath -Force
          }
          Write-Host "Removed $($matches.Count) affected roots from this ephemeral runner."
      - name: Secure Python packaging tools and CA trust
        run: python tools/package/ensure_python_ca_security.py

      - name: Configure native engines
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build native engines
        run: cmake --build build --config Release --parallel 2

      - name: Run native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.3

      - name: Build parent app onedir
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onedir
          --name math_sim
          --paths python
          python/math_sim/__main__.py

      - name: Collect native engines
        shell: pwsh
        run: |
          $target = "dist/math_sim/engines"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $candidates = @(
            "build/engines/Release",
            "build/engines",
            "build/Release/engines"
          )
          $source = $null
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              $source = $candidate
              break
            }
          }
          if (-not $source) {
            throw "Could not locate built engine directory"
          }
          Copy-Item "$source/*.exe" $target -Force

      - name: Validate distribution contents
        run: python tools/package/validate_dist.py dist/math_sim

      - name: Verify packaged CA bundle
        run: python tools/package/ensure_python_ca_security.py --check-package dist/math_sim

      - name: Packaged runtime smoke test
        run: dist/math_sim/math_sim.exe --smoke-test

      - name: Packaged UI smoke test
        run: dist/math_sim/math_sim.exe --ui-smoke

      - name: Packaged parent-to-engine E2E
        run: dist/math_sim/math_sim.exe --engine-e2e

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: math_sim-windows
          path: dist/math_sim
